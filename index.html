<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Shorty App</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif}
button{border:0;border-radius:10px;padding:12px 18px;font-weight:bold;cursor:pointer}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.loginbox{width:100%;max-width:400px;background:#151515;padding:25px;border-radius:20px;text-align:center}
.loginbox input{width:100%;padding:14px;margin:7px 0;border-radius:10px;border:0}
.google{width:100%;background:#fff;color:#111;margin-top:10px}
.email{width:100%;background:#ff0050;color:white;margin-top:10px}
#app{display:none}
header{position:fixed;top:0;left:0;right:0;height:55px;background:#000d;z-index:10;display:flex;align-items:center;justify-content:center}
header b{margin:0 12px}
.feed{padding-top:55px;padding-bottom:70px}
.videoCard{height:calc(100vh - 125px);position:relative;background:#111;margin-bottom:2px}
.videoCard video{width:100%;height:100%;object-fit:cover}
.info{position:absolute;bottom:20px;left:15px;right:80px;text-shadow:0 1px 5px #000}
.actions{position:absolute;right:12px;bottom:80px;display:flex;flex-direction:column;gap:12px}
.actions button{width:55px;height:55px;padding:5px;border-radius:50%;font-size:20px}
nav{position:fixed;bottom:0;left:0;right:0;height:65px;background:#111;display:flex;justify-content:space-around;align-items:center;z-index:20}
nav button{background:none;color:white;font-size:13px}
.upload{display:none;padding:80px 20px}
.uploadbox{background:#171717;padding:20px;border-radius:18px;text-align:center}
#file{margin:20px 0}
#progress{width:100%;height:8px}
.profile{display:none;padding:80px 20px 90px}
.avatar{width:80px;height:80px;border-radius:50%;background:#ff0050;display:flex;align-items:center;justify-content:center;font-size:35px;margin:auto}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="loginbox">
    <h1>🎬 Shorty</h1>
    <p>Login to continue</p>

    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button class="email" onclick="emailLogin()">Login / Sign Up</button>
    <button class="google" onclick="googleLogin()">🔵 Continue with Google</button>

    <p id="loginMsg"></p>
  </div>
</div>

<!-- APP -->
<div id="app">

<header>
  <b>Following</b>
  <b>For You</b>
</header>

<div id="feed" class="feed"></div>

<!-- UPLOAD -->
<div id="upload" class="upload">
  <div class="uploadbox">
    <h2>📤 Upload Video</h2>
    <p>Select your video</p>
    <input id="file" type="file" accept="video/*">
    <br>
    <button onclick="uploadVideo()">Upload</button>
    <progress id="progress" value="0" max="100"></progress>
    <p id="uploadMsg"></p>
  </div>
</div>

<!-- PROFILE -->
<div id="profile" class="profile">
  <div class="avatar">👤</div>
  <h2 id="profileName" style="text-align:center"></h2>
  <p id="profileEmail" style="text-align:center"></p>

  <hr>
  <h3>Your Shorty ID</h3>
  <h2 id="shortyID"></h2>

  <button onclick="logout()">Logout</button>
</div>

<nav>
  <button onclick="showPage('home')">🏠<br>Home</button>
  <button onclick="showPage('upload')">➕<br>Upload</button>
  <button onclick="showPage('profile')">👤<br>Profile</button>
</nav>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDH1tbp7qpBjxecFCjFfbC1lPnLd_C-fmk",
  authDomain: "shorty-app-ddc31.firebaseapp.com",
  projectId: "shorty-app-ddc31",
  storageBucket: "shorty-app-ddc31.firebasestorage.app",
  messagingSenderId: "535422060118",
  appId: "1:535422060118:web:fd456d818dfed23340ddf7",
  measurementId: "G-T61VGQCHOM"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

auth.onAuthStateChanged(async user => {
  if(user){
    document.getElementById("login").style.display="none";
    document.getElementById("app").style.display="block";

    let id = "SH" + user.uid.substring(0,8).toUpperCase();

    document.getElementById("profileName").innerText =
      user.displayName || "Shorty User";

    document.getElementById("profileEmail").innerText =
      user.email || user.phoneNumber || "";

    document.getElementById("shortyID").innerText = id;

    loadVideos();
  }else{
    document.getElementById("login").style.display="flex";
    document.getElementById("app").style.display="none";
  }
});

function googleLogin(){
  const provider = new firebase.auth.GoogleAuthProvider();

  auth.signInWithPopup(provider)
  .catch(e=>{
    document.getElementById("loginMsg").innerText=e.message;
  });
}

function emailLogin(){
  const email=document.getElementById("email").value;
  const password=document.getElementById("password").value;

  if(!email || !password){
    document.getElementById("loginMsg").innerText="Email اور Password لکھیں";
    return;
  }

  auth.signInWithEmailAndPassword(email,password)
  .catch(()=>{
    auth.createUserWithEmailAndPassword(email,password)
    .catch(e=>{
      document.getElementById("loginMsg").innerText=e.message;
    });
  });
}

async function uploadVideo(){

  const user=auth.currentUser;
  const file=document.getElementById("file").files[0];

  if(!user){
    alert("پہلے Login کریں");
    return;
  }

  if(!file){
    alert("پہلے Video منتخب کریں");
    return;
  }

  const msg=document.getElementById("uploadMsg");
  const progress=document.getElementById("progress");

  msg.innerText="Uploading...";

  const fileName=Date.now()+"_"+file.name;
  const ref=storage.ref("videos/"+user.uid+"/"+fileName);

  const upload=ref.put(file);

  upload.on("state_changed",
    snap=>{
      let percent=(snap.bytesTransferred/snap.totalBytes)*100;
      progress.value=percent;
    },
    error=>{
      msg.innerText="Upload Error: "+error.message;
    },
    async ()=>{
      const url=await upload.snapshot.ref.getDownloadURL();

      await db.collection("videos").add({
        videoUrl:url,
        userId:user.uid,
        userName:user.displayName || "Shorty User",
        createdAt:firebase.firestore.FieldValue.serverTimestamp(),
        likes:0
      });

      msg.innerText="✅ Video Uploaded!";
      document.getElementById("file").value="";
      loadVideos();
    }
  );
}

async function loadVideos(){

  const feed=document.getElementById("feed");

  feed.innerHTML="<p style='padding:30px'>Loading videos...</p>";

  try{
    const snap=await db.collection("videos")
      .orderBy("createdAt","desc")
      .limit(20)
      .get();

    feed.innerHTML="";

    if(snap.empty){
      feed.innerHTML=
        "<p style='padding:30px'>ابھی کوئی video upload نہیں ہوئی۔</p>";
      return;
    }

    snap.forEach(doc=>{
      const v=doc.data();

      feed.innerHTML+=`
      <div class="videoCard">
        <video src="${v.videoUrl}" controls loop playsinline></video>

        <div class="info">
          <b>@${v.userName || "Shorty User"}</b>
          <p>Shorty video 🎬</p>
        </div>

        <div class="actions">
          <button onclick="likeVideo('${doc.id}')">❤️</button>
          <button onclick="commentVideo()">💬</button>
          <button onclick="shareVideo('${v.videoUrl}')">↗️</button>
          <button onclick="followUser('${v.userId}')">➕</button>
        </div>
      </div>`;
    });

  }catch(e){
    feed.innerHTML="<p style='padding:30px'>Videos load نہیں ہو سکیں: "+e.message+"</p>";
  }
}

async function likeVideo(id){
  await db.collection("videos").doc(id).update({
    likes:firebase.firestore.FieldValue.increment(1)
  });
  alert("❤️ Like");
}

function commentVideo(){
  const c=prompt("Comment لکھیں:");
  if(c) alert("Comment: "+c);
}

function followUser(id){
  alert("Following User: "+id);
}

function shareVideo(url){
  if(navigator.share){
    navigator.share({
      title:"Shorty Video",
      url:url
    });
  }else{
    navigator.clipboard.writeText(url);
    alert("Video link copied!");
  }
}

function showPage(page){

  document.getElementById("feed").style.display="none";
  document.getElementById("upload").style.display="none";
  document.getElementById("profile").style.display="none";

  if(page==="home"){
    document.getElementById("feed").style.display="block";
    loadVideos();
  }

  if(page==="upload"){
    document.getElementById("upload").style.display="block";
  }

  if(page==="profile"){
    document.getElementById("profile").style.display="block";
  }
}

function logout(){
  auth.signOut();
}
</script>

</body>
</html>
