<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shorty App</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#000;color:#fff}
.app{max-width:500px;margin:auto;min-height:100vh;background:#111}
header{padding:20px;text-align:center;font-size:24px;font-weight:bold}
.login{padding:25px}
.login h2{text-align:center;margin:25px 0}
input{
 width:100%;padding:14px;margin:8px 0;
 border:0;border-radius:8px;
}
button{
 width:100%;padding:14px;margin:8px 0;
 border:0;border-radius:8px;
 font-weight:bold;cursor:pointer;
}
.google{background:#fff;color:#111}
.phone{background:#168cff;color:#fff}
.email{background:#ff0050;color:#fff}
.divider{text-align:center;margin:15px;color:#aaa}
#appScreen{display:none}
.profile{
 text-align:center;padding:30px 15px
}
.avatar{
 width:90px;height:90px;border-radius:50%;
 background:#444;margin:auto;
 display:flex;align-items:center;justify-content:center;
 font-size:40px
}
.stats{
 display:flex;justify-content:space-around;
 margin:25px 0
}
.stat{text-align:center}
.nav{
 position:fixed;bottom:0;left:50%;
 transform:translateX(-50%);
 max-width:500px;width:100%;
 background:#080808;
 display:flex;justify-content:space-around;
 padding:15px
}
.nav div{text-align:center}
.message{
 background:#222;padding:20px;border-radius:10px;
 margin-top:15px
}
</style>
</head>

<body>

<div class="app">

<header>🎵 Shorty</header>

<!-- LOGIN -->
<div class="login" id="loginScreen">

<h2>Welcome to Shorty</h2>

<button class="google" onclick="googleLogin()">
🔵 Continue with Google
</button>

<button class="phone" onclick="phoneLogin()">
📱 Continue with Phone
</button>

<div class="divider">OR</div>

<input id="email" type="email" placeholder="Email">

<input id="password" type="password" placeholder="Password">

<button class="email" onclick="emailLogin()">
📧 Login / Create Account
</button>

<p style="text-align:center;color:#aaa;margin-top:15px">
Create your Shorty account
</p>

</div>


<!-- APP -->
<div id="appScreen">

<div class="profile">

<div class="avatar">👤</div>

<h2 id="username">@shorty_user</h2>

<p>Shorty Creator</p>

<div class="stats">

<div class="stat">
<b id="following">0</b><br>
Following
</div>

<div class="stat">
<b id="followers">0</b><br>
Followers
</div>

<div class="stat">
<b id="likes">0</b><br>
Likes
</div>

</div>

<button onclick="uploadVideo()">
⬆️ Upload Video
</button>

<div class="message">
🎬 Your videos will appear here
</div>

</div>

<div class="nav">

<div onclick="home()">🏠<br>Home</div>

<div onclick="search()">🔍<br>Search</div>

<div onclick="uploadVideo()">➕<br>Upload</div>

<div onclick="messages()">💬<br>Messages</div>

<div onclick="profile()">👤<br>Profile</div>

</div>

</div>

</div>


<script type="module">

/*
  IMPORTANT:
  Firebase Web configuration will be added here
  after we create the Web App in Firebase.
*/

const firebaseConfig = {
  apiKey: "PASTE_YOUR_API_KEY_HERE",
  authDomain: "PASTE_YOUR_AUTH_DOMAIN_HERE",
  projectId: "shorty-app-ddc31",
  storageBucket: "PASTE_YOUR_STORAGE_BUCKET_HERE",
  messagingSenderId: "PASTE_YOUR_MESSAGING_SENDER_ID_HERE",
  appId: "PASTE_YOUR_APP_ID_HERE"
};


// Temporary buttons until Firebase config is connected

window.googleLogin = function(){
  alert("Google Login will work after Firebase Web configuration is added.");
}

window.phoneLogin = function(){
  alert("Phone OTP will work after Firebase Web configuration is added.");
}

window.emailLogin = function(){

  const email=document.getElementById("email").value;

  const password=document.getElementById("password").value;

  if(!email || !password){
    alert("Please enter email and password.");
    return;
  }

  alert("Email login will work after Firebase is connected.");
}

window.uploadVideo = function(){
  alert("Video upload will be connected in the next step.");
}

window.search = function(){
  alert("Search will be added.");
}

window.messages = function(){
  alert("Messages will be added.");
}

window.profile = function(){
  alert("You are on your profile.");
}

window.home = function(){
  alert("Home feed will be added.");
}

</script>

</body>
</html>
