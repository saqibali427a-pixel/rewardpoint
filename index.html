<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shorty Video App</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

html,body{
  background:#000;
  color:#fff;
}

body{
  max-width:500px;
  margin:auto;
}

.app{
  background:#000;
  min-height:100vh;
  padding-bottom:65px;
}

/* TOP */
.top{
  position:fixed;
  top:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:500px;
  height:58px;
  z-index:50;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:16px;
  background:linear-gradient(#000,transparent);
}

.top button{
  border:0;
  background:none;
  color:#aaa;
  font-size:15px;
  font-weight:bold;
}

.top button.active{
  color:#fff;
}

.search{
  position:absolute;
  right:15px;
  font-size:23px;
}

/* VIDEO */
.video{
  height:calc(100vh - 65px);
  min-height:600px;
  position:relative;
  background:#111;
  overflow:hidden;
}

.video video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.video:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    transparent 55%,
    rgba(0,0,0,.75)
  );
  pointer-events:none;
}

/* INFO */
.info{
  position:absolute;
  left:15px;
  bottom:25px;
  width:72%;
  z-index:5;
  text-shadow:0 1px 4px #000;
}

.info h3{
  font-size:16px;
  margin-bottom:9px;
}

.info p{
  font-size:14px;
  margin-top:5px;
}

/* ACTIONS */
.actions{
  position:absolute;
  right:12px;
  bottom:45px;
  z-index:10;
  display:flex;
  flex-direction:column;
  gap:18px;
  text-align:center;
}

.action button{
  border:0;
  background:none;
  color:white;
  font-size:27px;
  cursor:pointer;
}

.action small{
  display:block;
  font-size:11px;
  margin-top:2px;
}

/* BOTTOM */
.bottom{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:500px;
  height:65px;
  z-index:100;
  background:#080808;
  border-top:1px solid #333;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.bottom button{
  background:none;
  border:0;
  color:white;
  font-size:11px;
}

.bottom b{
  display:block;
  font-size:22px;
  margin-bottom:3px;
}

.plus{
  font-size:26px!important;
  background:white!important;
  color:#000!important;
  border-radius:10px;
  padding:2px 13px;
}

/* MESSAGE */
.toast{
  position:fixed;
  left:50%;
  bottom:80px;
  transform:translateX(-50%);
  background:#fff;
  color:#000;
  padding:10px 18px;
  border-radius:20px;
  display:none;
  z-index:200;
  font-size:13px;
}
</style>
</head>

<body>

<div class="app">

  <!-- TOP -->
  <div class="top">
    <button onclick="showMessage('Following')">Following</button>
    <button class="active">For You</button>
    <button class="search" onclick="showMessage('Search coming soon 🔍')">🔍</button>
  </div>


  <!-- VIDEO 1 -->
  <section class="video">
    <video
      src="https://cdn.pixabay.com/video/2020/05/24/40120-424876900_large.mp4"
      autoplay
      muted
      loop
      playsinline>
    </video>

    <div class="info">
      <h3>@CartoonWorld</h3>
      <p>😂 Funny short video</p>
      <p>🎵 Original sound</p>
    </div>

    <div class="actions">
      <div class="action">
        <button onclick="like(this)">❤️</button>
        <small>1.2K</small>
      </div>

      <div class="action">
        <button onclick="showMessage('Comments coming soon 💬')">💬</button>
        <small>86</small>
      </div>

      <div class="action">
        <button onclick="showMessage('Share button clicked ↗️')">↗️</button>
        <small>Share</small>
      </div>

      <div class="action">
        <button onclick="showMessage('Saved 🔖')">🔖</button>
        <small>Save</small>
      </div>
    </div>
  </section>


  <!-- VIDEO 2 -->
  <section class="video">
    <video
      src="https://cdn.pixabay.com/video/2020/06/24/42825-435570630_large.mp4"
      autoplay
      muted
      loop
      playsinline>
    </video>

    <div class="info">
      <h3>@FunVideos</h3>
      <p>🎮 Gaming & fun</p>
      <p>🎵 Original sound</p>
    </div>

    <div class="actions">
      <div class="action">
        <button onclick="like(this)">❤️</button>
        <small>854</small>
      </div>

      <div class="action">
        <button onclick="showMessage('Comments coming soon 💬')">💬</button>
        <small>42</small>
      </div>

      <div class="action">
        <button onclick="showMessage('Share button clicked ↗️')">↗️</button>
        <small>Share</small>
      </div>

      <div class="action">
        <button onclick="showMessage('Saved 🔖')">🔖</button>
        <small>Save</small>
      </div>
    </div>
  </section>


  <!-- VIDEO 3 -->
  <section class="video">
    <video
      src="https://cdn.pixabay.com/video/2020/05/29/40375-425819564_large.mp4"
      autoplay
      muted
      loop
      playsinline>
    </video>

    <div class="info">
      <h3>@KidsFun</h3>
      <p>🥕 Funny cartoon adventure</p>
      <p>🎵 Original sound</p>
    </div>

    <div class="actions">
      <div class="action">
        <button onclick="like(this)">❤️</button>
        <small>2.4K</small>
      </div>

      <div class="action">
        <button onclick="showMessage('Comments coming soon 💬')">💬</button>
        <small>120</small>
      </div>

      <div class="action">
        <button onclick="showMessage('Share button clicked ↗️')">↗️</button>
        <small>Share</small>
      </div>

      <div class="action">
        <button onclick="showMessage('Saved 🔖')">🔖</button>
        <small>Save</small>
      </div>
    </div>
  </section>


  <!-- BOTTOM -->
  <div class="bottom">

    <button onclick="home()">
      <b>⌂</b>
      Home
    </button>

    <button onclick="showMessage('Search coming soon 🔍')">
      <b>🔍</b>
      Search
    </button>

    <button onclick="showMessage('Video Upload coming next 🎥')">
      <b class="plus">＋</b>
      Upload
    </button>

    <button onclick="showMessage('Messages coming next 💬')">
      <b>💬</b>
      Messages
    </button>

    <button onclick="showMessage('Profile coming next 👤')">
      <b>👤</b>
      Profile
    </button>

  </div>

</div>

<div class="toast" id="toast"></div>

<script>

function showMessage(text){
  const toast=document.getElementById("toast");
  toast.innerText=text;
  toast.style.display="block";

  setTimeout(()=>{
    toast.style.display="none";
  },1800);
}

function like(button){
  if(button.innerText==="❤️"){
    button.innerText="❤️";
    showMessage("Liked ❤️");
  }
}

function home(){
  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

/* Pause videos when they are not visible */
const videos=document.querySelectorAll("video");

const observer=new IntersectionObserver((entries)=>{
  entries.forEach(entry=>{
    const video=entry.target;

    if(entry.isIntersecting){
      video.play().catch(()=>{});
    }else{
      video.pause();
    }
  });
},{
  threshold:.6
});

videos.forEach(video=>{
  observer.observe(video);
});

</script>

</body>
</html>
